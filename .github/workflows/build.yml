                      }
                  }
                  return doubleArrayOf(s, tx, ty)
              }

              private fun warpGray(
                  src: FloatArray, W: Int, H: Int, s: Float, tx: Float, ty: Float,
                  dst: FloatArray, valid: FloatArray
              ) {
                  val cx = (W - 1) / 2f
                  val cy = (H - 1) / 2f
                  parFor(H) { y ->
                      for (x in 0 until W) {
                          var qx = cx + s * (x - cx) + tx
                          var qy = cy + s * (y - cy) + ty
                          var v = 1f
                          if (qx < 0f || qy < 0f || qx > W - 1f || qy > H - 1f) {
                              v = 0f
                              qx = qx.coerceIn(0f, W - 1f)
                              qy = qy.coerceIn(0f, H - 1f)
                          }
                          val x0 = min(qx.toInt(), W - 2)
                          val y0 = min(qy.toInt(), H - 2)
                          val fx = qx - x0
                          val fy = qy - y0
                          val i0 = y0 * W + x0
                          val i = y * W + x
                          dst[i] = bilin(src, i0, W, fx, fy)
                          valid[i] = v
                      }
                  }
              }

              private fun readLuma(file: File, w: Int, h: Int): FloatArray {
                  val px = decode(file, w, h)
                  val gray = FloatArray(px.size)
                  parFor(h) { y ->
                      for (x in 0 until w) {
                          val j = y * w + x
                          val p = px[j]
                          gray[j] = 0.299f * ((p shr 16) and 255) + 0.587f * ((p shr 8) and 255) + 0.114f * (p and 255)
                      }
                  }
                  return gray
              }

              private suspend fun align(
                  files: List<File>, ref: Int, w: Int, h: Int, onProgress: (String, Int, Int) -> Unit
              ): Array<DoubleArray> {
                  val t = Array(files.size) { doubleArrayOf(1.0, 0.0, 0.0) }
                  val reference = buildEstPyr(readLuma(files[ref], w, h), w, h)
                  var done = 1
                  for (direction in intArrayOf(-1, 1)) {
                      var previous = reference
                      var i = ref + direction
                      while (i in files.indices) {
                          coroutineContext.ensureActive()
                          val current = buildEstPyr(readLuma(files[i], w, h), w, h)
                          t[i] = composeTransform(t[i - direction], estimate(previous, current, w, h))
                          previous = current
                          onProgress("Hizalama", ++done, files.size)
                          i += direction
                      }
                  }
                  return t
              }

              private fun warpChannel(
                  src: IntArray, w: Int, h: Int, scale: Float, tx: Float, ty: Float, shift: Int, dst: FloatArray
              ) {
                  val cx = (w - 1) / 2f
                  val cy = (h - 1) / 2f
                  parFor(h) { y ->
                      val qy = (cy + scale * (y - cy) + ty).coerceIn(0f, h - 1f)
                      val y0 = min(qy.toInt(), h - 2)
                      val fy = qy - y0
                      for (x in 0 until w) {
                          val qx = (cx + scale * (x - cx) + tx).coerceIn(0f, w - 1f)
                          val x0 = min(qx.toInt(), w - 2)
                          val fx = qx - x0
                          val j = y0 * w + x0
                          val a = ((src[j] ushr shift) and 255) * ((1f - fx) * (1f - fy))
                          val b = ((src[j + 1] ushr shift) and 255) * (fx * (1f - fy))
                          val c = ((src[j + w] ushr shift) and 255) * ((1f - fx) * fy)
                          val d = ((src[j + w + 1] ushr shift) and 255) * (fx * fy)
                          dst[y * w + x] = a + b + c + d
                      }
                  }
              }

              private fun orient(bitmap: Bitmap, rotation: Int): Bitmap {
                  if (rotation % 360 == 0) return bitmap
                  val m = Matrix().apply { postRotate(rotation.toFloat()) }
                  val rotated = Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, m, true)
                  if (rotated !== bitmap) bitmap.recycle()
                  return rotated
              }

              class Result internal constructor(
                  val bitmap: Bitmap, private val w: Int, private val h: Int,
                  private val ew: Int, private val eh: Int, private val rotation: Int,
                  private val transforms: Array<DoubleArray>, private val topFrames: Array<IntArray>
              ) {
                  fun suggestedFrames(x: Float, y: Float): List<Int> {
                      val (sx, sy) = when ((rotation % 360 + 360) % 360) {
                          90 -> y to (h - 1 - x)
                          180 -> (w - 1 - x) to (h - 1 - y)
                          270 -> (w - 1 - y) to x
                          else -> x to y
                      }
                      val gx = ((sx / w * ew).toInt().coerceIn(0, ew - 1)) / SUGGEST_STEP
                      val gy = ((sy / h * eh).toInt().coerceIn(0, eh - 1)) / SUGGEST_STEP
                      val j = gy * ((ew + SUGGEST_STEP - 1) / SUGGEST_STEP) + gx
                      return topFrames.map { it[j] }.filter { it >= 0 }
                  }

                  fun alignedSource(file: File, index: Int): Bitmap {
                      val px = decode(file, w, h)
                      val t = transforms[index]
                      val s = t[0].toFloat()
                      val tx = t[1].toFloat() * (w.toFloat() / ew)
                      val ty = t[2].toFloat() * (h.toFloat() / eh)
                      val cx = (w - 1) / 2f
                      val cy = (h - 1) / 2f
                      // Inverse of the same reference-to-source mapping used for fusion.
                      // Android Canvas maps pixel centers at (x+0.5, y+0.5).
                      val m = Matrix().apply {
                          setScale(1f / s, 1f / s)
                          postTranslate(cx + 0.5f - (cx + 0.5f + tx) / s, cy + 0.5f - (cy + 0.5f + ty) / s)
                      }
                      val source = Bitmap.createBitmap(px, w, h, Bitmap.Config.ARGB_8888)
                      val aligned = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      try {
                          Canvas(aligned).drawBitmap(source, m, Paint(Paint.FILTER_BITMAP_FLAG))
                          return orient(aligned, rotation)
                      } catch (e: Throwable) {
                          aligned.recycle()
                          throw e
                      } finally { source.recycle() }
                  }
              }

          }
