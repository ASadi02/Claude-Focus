name: Build S23U FocusStack APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Lisanslarini Onayla
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Gradle 8.7 Kurulumu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Tum Proje ve Kotlin Kaynak Dosyalarini Olustur
        run: |
          rm -rf app build settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/s23ultra/focusstack
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "S23UltraFocusStack"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.s23ultra.focusstack"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.s23ultra.focusstack"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 5
                  versionName = "3.2-S23U-Retouch"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="S23U Focus Stack"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name="com.s23ultra.focusstack.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/s23ultra/focusstack/FocusStackProcessor.kt << 'EOF'
          package com.s23ultra.focusstack

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Matrix
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.ensureActive
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.DataInputStream
          import java.nio.ByteBuffer
          import kotlin.coroutines.coroutineContext
          import java.util.stream.IntStream
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.pow
          import kotlin.math.roundToInt

          object FocusStackProcessor {

              const val MAX_WORK_SIDE = 3072
              private const val EST_MAX_SIDE = 1280
              private const val PYRAMID_LEVELS = 6
              private const val SUGGEST_STEP = 24
              private val GAUSS5 = floatArrayOf(1f / 16f, 4f / 16f, 6f / 16f, 4f / 16f, 1f / 16f)
              private val BOX7 = FloatArray(7) { 1f / 7f }

              private class Img(val w: Int, val h: Int, val d: FloatArray)
              private class EstPyr(val levels: List<Img>)

              private inline fun parFor(n: Int, crossinline body: (Int) -> Unit) {
                  IntStream.range(0, n).parallel().forEach { i -> body(i) }
              }

              suspend fun stack(
                  files: List<File>,
                  rotationDeg: Int,
                  onProgress: (stage: String, done: Int, total: Int) -> Unit
              ): Result = withContext(Dispatchers.Default) {
                  require(files.size >= 2) { "En az 2 kare gerekli" }

                  val bo = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(files[0].path, bo)
                  val srcW = bo.outWidth
                  val srcH = bo.outHeight

                  require(srcW >= 64 && srcH >= 64) { "JPEG boyutu gecersiz" }
                  val workScale = min(1f, MAX_WORK_SIDE.toFloat() / max(srcW, srcH))
                  val W = max(64, (srcW * workScale).roundToInt())
                  val H = max(64, (srcH * workScale).roundToInt())

                  val estScale = min(1f, EST_MAX_SIDE.toFloat() / max(srcW, srcH))
                  val eW = max(64, (srcW * estScale).roundToInt())
                  val eH = max(64, (srcH * estScale).roundToInt())

                  val n = files.size
                  val refIdx = n / 2

                  val scoreFiles = ArrayList<File>()
                  try {
                      val transforms = align(files, refIdx, eW, eH, onProgress)
                      val count = eW * eH
                      val maxEnergy = FloatArray(count)
                      val validCount = IntArray(count)
                      val sum = FloatArray(count)
                      val score = FloatArray(count)
                      val aligned = FloatArray(count)
                      val valid = FloatArray(count)
                      val bytes = ByteBuffer.allocate(count * 4)
                      val cols = (eW + SUGGEST_STEP - 1) / SUGGEST_STEP
                      val rows = (eH + SUGGEST_STEP - 1) / SUGGEST_STEP
                      val topFrames = Array(3) { IntArray(cols * rows) { -1 } }
                      val topScores = Array(3) { FloatArray(cols * rows) { -1f } }
                      for (i in files.indices) {
                          ensureActive()
                          val t = transforms[i]
                          warpGray(readLuma(files[i], eW, eH), eW, eH,
                              t[0].toFloat(), t[1].toFloat(), t[2].toFloat(), aligned, valid)
                          val energy = denoisedSharpness(aligned, eW, eH)
                          parFor(eH) { y ->
                              for (x in 0 until eW) {
                                  val j = y * eW + x
                                  if (valid[j] > 0.5f) {
                                      maxEnergy[j] = max(maxEnergy[j], energy[j])
                                      validCount[j]++
                                  } else energy[j] = -1f
                              }
                          }
                          for (gy in 0 until rows) for (gx in 0 until cols) {
                              val cx = min(gx * SUGGEST_STEP + SUGGEST_STEP / 2, eW - 1)
                              val cy = min(gy * SUGGEST_STEP + SUGGEST_STEP / 2, eH - 1)
                              var total = 0f
                              var samples = 0
                              for (dy in -6..6 step 6) for (dx in -6..6 step 6) {
                                  val e = energy[(cy + dy).coerceIn(0, eH - 1) * eW + (cx + dx).coerceIn(0, eW - 1)]
                                  if (e >= 0f) { total += e; samples++ }
                              }
                              if (samples == 0) continue
                              val j = gy * cols + gx
                              val mean = total / samples
                              val rank = (0..2).firstOrNull { mean > topScores[it][j] } ?: continue
                              for (k in 2 downTo rank + 1) {
                                  topScores[k][j] = topScores[k - 1][j]
                                  topFrames[k][j] = topFrames[k - 1][j]
                              }
                              topScores[rank][j] = mean
                              topFrames[rank][j] = i
                          }
                          val disk = File.createTempFile("focus_energy_", ".bin", files[0].parentFile)
                          scoreFiles.add(disk)
                          bytes.asFloatBuffer().put(energy)
                          disk.writeBytes(bytes.array())
                          onProgress("Keskinlik analizi", i + 1, n)
                      }

                      fun readScore(i: Int) {
                          DataInputStream(scoreFiles[i].inputStream()).use { it.readFully(bytes.array()) }
                          bytes.asFloatBuffer().get(score)
                      }
                      fun rawWeight(j: Int): Float {
                          val floor = max(1.1f, maxEnergy[j] * 0.28f)
                          val above = max(0f, score[j] - floor)
                          return if (above > 0f) above.pow(4) else 0f
                      }
                      for (i in files.indices) {
                          ensureActive()
                          readScore(i)
                          parFor(eH) { y ->
                              for (x in 0 until eW) {
                                  val j = y * eW + x
                                  sum[j] += rawWeight(j)
                              }
                          }
                      }
                      fun weightFor(i: Int): FloatArray {
                          readScore(i)
                          parFor(eH) { y ->
                              for (x in 0 until eW) {
                                  val j = y * eW + x
                                  score[j] = when {
                                      sum[j] > 1e-12f -> rawWeight(j) * (1f / sum[j])
                                      validCount[j] == 0 -> if (i == refIdx) 1f else 0f
                                      score[j] >= 0f -> 1f / validCount[j]
                                      else -> 0f
                                  }
                              }
                          }
                          val smoothed = convSep(score, eW, eH, GAUSS5)
                          return convSep(smoothed, eW, eH, GAUSS5)
                      }

                      // 2. ASAMA: Tam cozunurlukte 6 katmanli Laplacian Piramit birlestirme
                      val sizes = ArrayList<IntArray>()
                      var lw = W
                      var lh = H
                      sizes.add(intArrayOf(lw, lh))
                      while (sizes.size < PYRAMID_LEVELS && min(lw, lh) >= 16) {
                          lw = (lw + 1) / 2
                          lh = (lh + 1) / 2
                          sizes.add(intArrayOf(lw, lh))
                      }
                      val lv = sizes.size
                      val num = Array(3) { Array(lv) { k -> FloatArray(sizes[k][0] * sizes[k][1]) } }
                      val den = Array(lv) { k -> FloatArray(sizes[k][0] * sizes[k][1]) }

                      val channel = FloatArray(W * H)
                      val px = IntArray(W * H)

                      for (i in 0 until n) {
                          ensureActive()
                          decode(files[i], W, H, px)
                          val t = transforms[i]
                          val s = t[0].toFloat()
                          val tx = t[1].toFloat() * (W.toFloat() / eW)
                          val ty = t[2].toFloat() * (H.toFloat() / eH)
                          val wgt = upsampleBilinear(weightFor(i), eW, eH, W, H, s, tx, ty)

                          val wp = ArrayList<Img>(lv)
                          var wc = Img(W, H, wgt)
                          wp.add(wc)
                          for (k in 1 until lv) {
                              wc = reduce(wc)
                              wp.add(wc)
                          }
                          for (k in 0 until lv) {
                              val dk = den[k]
                              val wk = wp[k].d
                              parFor(dk.size) { j -> dk[j] += wk[j] }
                          }

                          for (c in 0 until 3) {
                              warpChannel(px, W, H, s, tx, ty, 16 - 8 * c, channel)
                              var g = Img(W, H, channel)
                              for (k in 0 until lv - 1) {
                                  val gn = reduce(g)
                                  val nk = num[c][k]
                                  val wk = wp[k].d
                                  val gd = g.d
                                  expandEach(gn, g.w, g.h) { j, up -> nk[j] += wk[j] * (gd[j] - up) }
                                  g = gn
                              }
                              val nk = num[c][lv - 1]
                              val wk = wp[lv - 1].d
                              val gd = g.d
                              parFor(nk.size) { j -> nk[j] += wk[j] * gd[j] }
                          }
                          onProgress("Piramit birlestirme", i + 1, n)
                      }

                      val out = Array(3) { c ->
                          for (k in 0 until lv) {
                              val a = num[c][k]
                              val d = den[k]
                              parFor(a.size) { j -> a[j] /= max(d[j], 1e-9f) }
                          }
                          var cur = Img(sizes[lv - 1][0], sizes[lv - 1][1], num[c][lv - 1])
                          for (k in lv - 2 downTo 0) {
                              val w = sizes[k][0]
                              val h = sizes[k][1]
                              val a = num[c][k]
                              expandEach(cur, w, h) { j, up -> a[j] += up }
                              cur = Img(w, h, a)
                          }
                          cur.d
                      }

                      val argb = px
                      parFor(W * H) { i ->
                          val r = out[0][i].roundToInt().coerceIn(0, 255)
                          val g = out[1][i].roundToInt().coerceIn(0, 255)
                          val b = out[2][i].roundToInt().coerceIn(0, 255)
                          argb[i] = (0xFF shl 24) or (r shl 16) or (g shl 8) or b
                      }
                      val bmp = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888)
                      try {
                          bmp.setPixels(argb, 0, W, 0, 0, W, H)
                          Result(orient(bmp, rotationDeg), W, H, eW, eH, rotationDeg, transforms, topFrames)
                      } catch (e: Throwable) {
                          bmp.recycle()
                          throw e
                      }
                  } finally {
                      scoreFiles.forEach { it.delete() }
                  }
              }


              private fun composeTransform(base: DoubleArray, step: DoubleArray): DoubleArray {
                  val s = step[0] * base[0]
                  val tx = step[0] * base[1] + step[1]
                  val ty = step[0] * base[2] + step[2]
                  return doubleArrayOf(s, tx, ty)
              }

              private fun decode(file: File, outW: Int, outH: Int, px: IntArray = IntArray(outW * outH)): IntArray {
                  val bo = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(file.path, bo)
                  var sample = 1
                  while (bo.outWidth / (sample * 2) >= outW && bo.outHeight / (sample * 2) >= outH) sample *= 2
                  val o = BitmapFactory.Options().apply {
                      inSampleSize = sample
                      inPreferredConfig = Bitmap.Config.ARGB_8888
                  }
                  val bm = BitmapFactory.decodeFile(file.path, o)
                      ?: throw IllegalStateException("JPEG cozulemedi: ${file.name}")
                  val scaled = if (bm.width == outW && bm.height == outH) bm
                  else Bitmap.createScaledBitmap(bm, outW, outH, true)
                  if (scaled !== bm) bm.recycle()
                  scaled.getPixels(px, 0, outW, 0, 0, outW, outH)
                  scaled.recycle()
                  return px
              }

              private fun convSep(src: FloatArray, w: Int, h: Int, k: FloatArray): FloatArray {
                  val r = k.size / 2
                  val tmp = FloatArray(w * h)
                  val out = FloatArray(w * h)
                  parFor(h) { y ->
                      val o = y * w
                      for (x in 0 until w) {
                          var s = 0f
                          for (i in -r..r) {
                              val xx = min(max(x + i, 0), w - 1)
                              s += k[i + r] * src[o + xx]
                          }
                          tmp[o + x] = s
                      }
                  }
                  parFor(h) { y ->
                      for (x in 0 until w) {
                          var s = 0f
                          for (i in -r..r) {
                              val yy = min(max(y + i, 0), h - 1)
                              s += k[i + r] * tmp[yy * w + x]
                          }
                          out[y * w + x] = s
                      }
                  }
                  return out
              }

              private fun reduce(img: Img): Img {
                  val w = img.w
                  val h = img.h
                  val src = img.d
                  val nw = (w + 1) / 2
                  val tmp = FloatArray(nw * h)
                  parFor(h) { y ->
                      val o = y * w
                      for (i in 0 until nw) {
                          val x = i * 2
                          val a = src[o + max(x - 2, 0)]
                          val b = src[o + max(x - 1, 0)]
                          val c = src[o + x]
                          val d = src[o + min(x + 1, w - 1)]
                          val e = src[o + min(x + 2, w - 1)]
                          tmp[y * nw + i] = (a + 4f * b + 6f * c + 4f * d + e) / 16f
                      }
                  }
                  val nh = (h + 1) / 2
                  val out = FloatArray(nw * nh)
                  parFor(nh) { j ->
                      val y = j * 2
                      val y0 = max(y - 2, 0) * nw
                      val y1 = max(y - 1, 0) * nw
                      val y2 = y * nw
                      val y3 = min(y + 1, h - 1) * nw
                      val y4 = min(y + 2, h - 1) * nw
                      for (i in 0 until nw) {
                          out[j * nw + i] =
                              (tmp[y0 + i] + 4f * tmp[y1 + i] + 6f * tmp[y2 + i] + 4f * tmp[y3 + i] + tmp[y4 + i]) / 16f
                      }
                  }
                  return Img(nw, nh, out)
              }

              private inline fun expandEach(s: Img, dw: Int, dh: Int, crossinline write: (Int, Float) -> Unit) {
                  parFor(dh) { y ->
                      val fy = y * 0.5f
                      val y0 = min(fy.toInt(), s.h - 1)
                      val y1 = min(y0 + 1, s.h - 1)
                      val ty = fy - y0
                      for (x in 0 until dw) {
                          val fx = x * 0.5f
                          val x0 = min(fx.toInt(), s.w - 1)
                          val x1 = min(x0 + 1, s.w - 1)
                          val tx = fx - x0
                          val a = s.d[y0 * s.w + x0]
                          val b = s.d[y0 * s.w + x1]
                          val c = s.d[y1 * s.w + x0]
                          val d = s.d[y1 * s.w + x1]
                          write(y * dw + x, (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty)
                      }
                  }
              }

              private fun upsampleBilinear(
                  src: FloatArray, sw: Int, sh: Int, dw: Int, dh: Int, scale: Float, txWork: Float, tyWork: Float
              ): FloatArray {
                  val out = FloatArray(dw * dh)
                  val sxRatio = (sw - 1f) / max(1, dw - 1)
                  val syRatio = (sh - 1f) / max(1, dh - 1)
                  parFor(dh) { y ->
                      val fy = y * syRatio
                      val y0 = min(fy.toInt(), sh - 2)
                      val ty = fy - y0
                      val row0 = y0 * sw
                      val row1 = (y0 + 1) * sw
                      val dstRow = y * dw
                      for (x in 0 until dw) {
                          val fx = x * sxRatio
                          val x0 = min(fx.toInt(), sw - 2)
                          val tx = fx - x0
                          val a = src[row0 + x0]
                          val b = src[row0 + x0 + 1]
                          val c = src[row1 + x0]
                          val d = src[row1 + x0 + 1]
                          val v = (a * (1f - tx) + b * tx) * (1f - ty) + (c * (1f - tx) + d * tx) * ty
                          val cx = (dw - 1) / 2f
                          val cy = (dh - 1) / 2f
                          val qx = cx + scale * (x - cx) + txWork
                          val qy = cy + scale * (y - cy) + tyWork
                          out[dstRow + x] = if (qx in 0f..(dw - 1f) && qy in 0f..(dh - 1f))
                              v + 1e-6f else 1e-6f
                      }
                  }
                  return out
              }

              private fun denoisedSharpness(y: FloatArray, w: Int, h: Int): FloatArray {
                  val s1 = convSep(y, w, h, GAUSS5)
                  val s = convSep(s1, w, h, GAUSS5)
                  val e = FloatArray(w * h)
                  parFor(h) { yy ->
                      val row = yy * w
                      val u1 = max(yy - 1, 0) * w
                      val d1 = min(yy + 1, h - 1) * w
                      val u2 = max(yy - 2, 0) * w
                      val d2 = min(yy + 2, h - 1) * w
                      for (x in 0 until w) {
                          val c = s[row + x]
                          val ml1 = abs(2f * c - s[row + max(x - 1, 0)] - s[row + min(x + 1, w - 1)]) +
                                  abs(2f * c - s[u1 + x] - s[d1 + x])
                          val ml2 = abs(2f * c - s[row + max(x - 2, 0)] - s[row + min(x + 2, w - 1)]) +
                                  abs(2f * c - s[u2 + x] - s[d2 + x])
                          e[row + x] = ml1 + 0.75f * ml2
                      }
                  }
                  return convSep(e, w, h, BOX7)
              }

              private fun buildEstPyr(luma: FloatArray, W: Int, H: Int): EstPyr {
                  var cur = Img(W, H, convSep(luma, W, H, GAUSS5))
                  val levels = ArrayList<Img>()
                  levels.add(cur)
                  while (max(cur.w, cur.h) > 120) {
                      cur = reduce(cur)
                      levels.add(Img(cur.w, cur.h, convSep(cur.d, cur.w, cur.h, GAUSS5)))
                  }
                  return EstPyr(levels)
              }

              private fun bilin(a: FloatArray, i0: Int, w: Int, fx: Float, fy: Float): Float =
                  (a[i0] * (1 - fx) + a[i0 + 1] * fx) * (1 - fy) +
                          (a[i0 + w] * (1 - fx) + a[i0 + w + 1] * fx) * fy

              private fun solve3(h: DoubleArray, b: DoubleArray): DoubleArray? {
                  val a = arrayOf(
                      doubleArrayOf(h[0], h[1], h[2], b[0]),
                      doubleArrayOf(h[1], h[3], h[4], b[1]),
                      doubleArrayOf(h[2], h[4], h[5], b[2])
                  )
                  for (i in 0 until 3) {
                      var p = i
                      for (r in i + 1 until 3) if (abs(a[r][i]) > abs(a[p][i])) p = r
                      if (abs(a[p][i]) < 1e-9) return null
                      val t = a[i]; a[i] = a[p]; a[p] = t
                      for (r in i + 1 until 3) {
                          val f = a[r][i] / a[i][i]
                          for (c in i until 4) a[r][c] -= f * a[i][c]
                      }
                  }
                  val x = DoubleArray(3)
                  for (i in 2 downTo 0) {
                      var s = a[i][3]
                      for (c in i + 1 until 3) s -= a[i][c] * x[c]
                      x[i] = s / a[i][i]
                  }
                  return x
              }

              private fun estimate(ref: EstPyr, frm: EstPyr, W: Int, H: Int): DoubleArray {
                  var s = 1.0
                  var tx = 0.0
                  var ty = 0.0
                  val n = min(ref.levels.size, frm.levels.size)
                  for (j in n - 1 downTo 0) {
                      if (j < n - 1) { tx *= 2.0; ty *= 2.0 }
                      val f = (1 shl j).toDouble()
                      val cx = (W - 1) / (2.0 * f)
                      val cy = (H - 1) / (2.0 * f)
                      val R = ref.levels[j]
                      val F = frm.levels[j]
                      val w = R.w
                      val h = R.h
                      val gx = FloatArray(w * h)
                      val gy = FloatArray(w * h)
                      for (y in 1 until h - 1) {
                          for (x in 1 until w - 1) {
                              val i = y * w + x
                              gx[i] = (F.d[i + 1] - F.d[i - 1]) * 0.5f
                              gy[i] = (F.d[i + w] - F.d[i - w]) * 0.5f
                          }
                      }
                      val iters = if (j == 0) 10 else 16
                      val st = if (w * h > 450_000) 2 else 1
                      for (iter in 0 until iters) {
                          val hh = DoubleArray(6)
                          val bb = DoubleArray(3)
                          var cnt = 0
                          for (y in 2 until h - 2 step st) {
                              val uy = y - cy
                              for (x in 2 until w - 2 step st) {
                                  val ux = x - cx
                                  val qx = cx + s * ux + tx
                                  val qy = cy + s * uy + ty
                                  if (qx < 2.0 || qy < 2.0 || qx > w - 3.0 || qy > h - 3.0) continue
                                  val x0 = qx.toInt()
                                  val y0 = qy.toInt()
                                  val fx = (qx - x0).toFloat()
                                  val fy = (qy - y0).toFloat()
                                  val i0 = y0 * w + x0
                                  val fv = bilin(F.d, i0, w, fx, fy)
                                  val gxv = bilin(gx, i0, w, fx, fy).toDouble()
                                  val gyv = bilin(gy, i0, w, fx, fy).toDouble()
                                  val r = (fv - R.d[y * w + x]).toDouble()
                                  val j0 = gxv * ux + gyv * uy
                                  hh[0] += j0 * j0; hh[1] += j0 * gxv; hh[2] += j0 * gyv
                                  hh[3] += gxv * gxv; hh[4] += gxv * gyv; hh[5] += gyv * gyv
                                  bb[0] -= j0 * r; bb[1] -= gxv * r; bb[2] -= gyv * r
                                  cnt++
                              }
                          }
                          if (cnt < 200) break
                          hh[0] *= 1.0005; hh[3] *= 1.0005; hh[5] *= 1.0005
